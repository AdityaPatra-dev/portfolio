<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="avatarBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27272a"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="avatarBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3f3f46"/>
      <stop offset="1" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded-2xl square badge matching homepage AP avatar -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#avatarBg)" stroke="url(#avatarBorder)" stroke-width="2"/>

  <!-- AP Serif Typography -->
  <text
    x="31"
    y="36"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Instrument Serif', Georgia, 'Times New Roman', serif"
    font-size="34"
    font-weight="normal"
    letter-spacing="-1"
    fill="#f4f4f5"
  >AP</text>

  <!-- Live Active Indicator green dot matching homepage avatar -->
  <circle cx="51" cy="51" r="5.5" fill="#10b981" stroke="#18181b" stroke-width="2.2"/>
</svg>
