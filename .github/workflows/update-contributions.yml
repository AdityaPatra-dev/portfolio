name: Update GitHub Contributions

on:
  schedule:
    # Runs everyday at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest GitHub contribution data
        run: |
          curl -fsSL "https://github-contributions-api.jogruber.de/v4/AdityaPatra-dev?y=last" -o public/github-contributions.json
          # Validate JSON format
          jq '.total.lastYear' public/github-contributions.json

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add public/github-contributions.json
          if git diff --staged --quiet; then
            echo "No changes in contribution data."
          else
            git commit -m "chore(data): auto-update github contributions [skip ci]"
            git push
          fi
